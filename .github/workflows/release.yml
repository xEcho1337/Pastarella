name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}" # strip leading v: not a valid NuGet version
          dotnet publish src/Pastarella/Pastarella.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -o publish/${{ matrix.rid }} \
            -p:Version="$VERSION" \
            -p:InformationalVersion="${{ github.ref_name }}"
      - name: Rename binary
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mv "publish/${{ matrix.rid }}/Pastarella.exe" "release/pastarella-${{ matrix.rid }}.exe"
          else
            mv "publish/${{ matrix.rid }}/Pastarella" "release/pastarella-${{ matrix.rid }}"
            chmod +x "release/pastarella-${{ matrix.rid }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pastarella-${{ matrix.rid }}
          path: release/*

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            mv "$dir"* release/
            rmdir "$dir"
          done
          ls -la release/
      - name: Build changelog
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            RANGE="$TAG"
          else
            RANGE="$PREV..$TAG"
          fi
          echo "Range: $RANGE"
          LOG=$(git log "$RANGE" --pretty=format:'%h %s' --no-merges)
          {
            echo "body<<EOF"
            echo "=== All changes for this release ($RANGE) ==="
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          artifacts: "release/*"
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
